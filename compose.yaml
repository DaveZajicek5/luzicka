services:
  app:
    container_name: luzicka
    build:
      context: .
    restart: unless-stopped
    env_file:
      - /etc/luzicka/luzicka.env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      LAN_ONLY: "false"
      DATABASE_PATH: /data/luzicka.sqlite
      SECURE_COOKIES: "true"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /var/lib/luzicka:/data
      - /var/backups/luzicka:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
