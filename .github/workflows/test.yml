name: Test

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: find server.js src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check shell syntax
        run: find ops -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate container deployment
        run: |
          sudo mkdir -p /etc/luzicka /var/lib/luzicka /var/backups/luzicka
          printf '%s\n' 'VIEWER_PASSWORD=test-viewer' 'ADMIN_PASSWORD=test-admin' 'SESSION_SECRET=0123456789abcdef0123456789abcdef' > /tmp/luzicka.env
          sudo cp /tmp/luzicka.env /etc/luzicka/luzicka.env
          docker compose config --quiet
          docker build -t luzicka:test .
