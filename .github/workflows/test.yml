name: Test

on:
  push:
    branches: [main, agent/household-dashboard]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: find server.js src test -name '*.js' -print0 | xargs -0 -n1 node --check
